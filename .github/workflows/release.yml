name: Release

# Publishes a GitHub Release with the Windows and Linux binaries when main gets a version that has no release yet:
# raise `version` in [workspace.package] of Cargo.toml, merge, and the release rust-v<version> (tag included) is made
# from that commit. Pushes to main that keep the version publish nothing. The installer's update check at startup
# looks for exactly these tags and file names.
#
# A tag rust-v<version> pushed by hand (it must match Cargo.toml) or "Run workflow" on the Actions page also release.

on:
  push:
    branches: [main]
    tags: ["rust-v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          tag="rust-v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "$tag" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
            exit 1
          fi
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists: nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $tag."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows x64
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p aio-app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/all-in-1-installer.exe out/all-in-1-installer-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  linux:
    name: Linux x64
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p aio-app
      - name: Package
        run: |
          mkdir -p out
          cp target/release/all-in-1-installer out/all-in-1-installer-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/

  release:
    name: Publish release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The tag is made on this commit when it does not exist yet.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: All-in-1 Installer ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/all-in-1-installer-windows-x64.exe
            dist/all-in-1-installer-linux-x64
